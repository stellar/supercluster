name: Job monitor image

# Builds the parallel catchup job monitor image and pushes it to
# public.ecr.aws/stellar/ssc-job-monitor and DockerHub stellar/ssc-job-monitor.
# Replaces the Jenkins job Core/stellar-supercluster-job-monitor-docker.
# Manual runs from other branches only build the image. The DockerHub push is
# skipped until the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are set.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/MissionParallelCatchup/Dockerfile.jobmonitor'
      - 'src/MissionParallelCatchup/job_monitor.py'
      - '.github/workflows/job-monitor-image.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: job-monitor-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Determine image label
        id: vars
        run: echo "label=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          LABEL: ${{ steps.vars.outputs.label }}
        run: |
          docker build \
            -f src/MissionParallelCatchup/Dockerfile.jobmonitor \
            -t "ssc-job-monitor:${LABEL}" \
            src/MissionParallelCatchup

      - name: ECR login
        id: ecr-login
        if: github.ref == 'refs/heads/main'
        uses: stellar/actions/sdf-ecr-login@1f0afe5212a6547b2b044d7b546632d3e6f0abc4 # main as of stellar/actions#118
        with:
          login-public-ecr: 'true'

      - name: Push to public ECR
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.ecr-public-registry }}
          LABEL: ${{ steps.vars.outputs.label }}
        run: |
          set -eu
          IMAGE="${REGISTRY}/stellar/ssc-job-monitor"
          docker tag "ssc-job-monitor:${LABEL}" "${IMAGE}:${LABEL}"
          docker tag "ssc-job-monitor:${LABEL}" "${IMAGE}:latest"
          docker push "${IMAGE}:${LABEL}"
          docker push "${IMAGE}:latest"

      - name: Check DockerHub credentials
        id: dockerhub
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; skipping the DockerHub push"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: DockerHub login
        if: github.ref == 'refs/heads/main' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' && steps.dockerhub.outputs.enabled == 'true'
        env:
          LABEL: ${{ steps.vars.outputs.label }}
        run: |
          set -eu
          IMAGE="stellar/ssc-job-monitor"
          docker tag "ssc-job-monitor:${LABEL}" "${IMAGE}:${LABEL}"
          docker tag "ssc-job-monitor:${LABEL}" "${IMAGE}:latest"
          docker push "${IMAGE}:${LABEL}"
          docker push "${IMAGE}:latest"
