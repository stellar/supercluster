[pytest]
# The monitor and collector are plain modules, not an installed package, so the
# suite needs each source directory on the path: `apps` for job_monitor /
# log_collector, `lib` for the modules they import, `tests` for the fake-cluster
# harness. The container flattens apps/ and lib/ into /app, so `import config`
# resolves the same way there.
pythonpath = apps lib tests
testpaths = tests
# Async tests declare themselves with @pytest.mark.asyncio.
asyncio_mode = strict
