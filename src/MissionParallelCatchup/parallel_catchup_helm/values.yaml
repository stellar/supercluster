worker:
  stellar_core_image: "stellar/stellar-core:latest"
  replicas: 5
  # pvc: /data survives the pod, so an evicted range resumes at L+1 -- this is
  # what makes spot viable. ephemeral: /data is an emptyDir on the node, no
  # resume, and ephemeral_storage must be sized to hold it.
  storageMode: "pvc"
  storageClass: ""
  # Sized from what a range actually uses: the old node-local /data ran on a
  # 35Gi request / 40Gi limit. 40Gi x 1024 workers is 40 TiB of gp3 rather than
  # 100 TiB, which matters against the per-region storage quota.
  # One PVC per ledger range, not per concurrency slot. Measured on ssc-test:
  # 300 jobs each with their own PVC took 3151s vs 3210s reusing 40 -- 7.5x the
  # volume lifecycles for no measurable cost and no CSI throttling. Reuse only
  # bought bookkeeping, plus pinning every later range to the AZ the slot's
  # first volume happened to land in.
  storageSize: "40Gi"
  # Cap on PVC-mounting workers per node, enforced with a topologySpread
  # minDomains floor. A Nitro node allows ~26 EBS attachments and Karpenter does
  # not size nodes for attachment capacity. Inert at realistic density (1800m
  # CPU already yields ~4/node); only binds if CPU requests are small enough for
  # 24+ pods to share a node. 0 disables. pvc mode only.
  maxVolumesPerNode: 24
  requireNodeLabels: []
  avoidNodeLabels: []
  tolerateNodeTaints: []
  asanOptions: "quarantine_size_mb=1:malloc_context_size=5:alloc_dealloc_mismatch=0"
  resources: # resources below are left empty on purpose, they are read and overridden from `StellarKubeCfg.fs`
    requests:
      cpu: ""
      memory: ""
      ephemeral_storage: ""
    limits:
      cpu: ""
      memory: ""
      ephemeral_storage: ""
  historyGetCommandCore001:
    "curl -sf http://history.stellar.org/prd/core-live/core_live_001/{0} -o {1}"
  historyGetCommandCore002:
    "curl -sf http://history.stellar.org/prd/core-live/core_live_002/{0} -o {1}"
  historyGetCommandCore003:
    "curl -sf http://history.stellar.org/prd/core-live/core_live_003/{0} -o {1}"

# Index -> ledger range is computed in the Job template; no queue to preload.
range:
  # uniform: equal ledger counts. logarithmic: big chunks over cheap early
  # history, halving toward the tip, aiming for equal wall-time per job.
  generator: "uniform"
  logarithmicFloorLedgers: 64000
  startingLedger: 0
  latestLedgerNum: 100000
  overlapLedgers: 320
  # Dispatch order. Generators emit tip-first, which front-loads the most
  # expensive ranges. "oldest-first" reverses that so a profiling run
  # measures the cheap early ranges before it can be interrupted.
  order: tip-first
  ledgersPerJob: 16000

monitor:
  # Reuses the existing hand-built job-monitor image slot -- no new image and no
  # new push path (nothing in .github/workflows builds these).
  image: "stellar/ssc-job-monitor:latest"
  # Dev loop: run the monitor and collector from a ConfigMap holding
  # job_monitor.py and log_collector.py instead of a built image. Set it to the
  # ConfigMap name and point monitor.image at a plain python base; the deps the
  # Dockerfile bakes get pip-installed at start. Empty = use the image as built.
  sourceConfigMap: ""
  # Range profile from an earlier run, as a ConfigMap holding profile.json.
  # The mission driver resolves --pubnet-parallel-catchup-profile (a local
  # path or an https URL) into one. Empty = size from the configured
  # requests below. Only tightens requests; limits are untouched.
  profileConfigMap: ""
  # CPU request tiers, as a slack budget rather than a demand estimate. Measured
  # unthrottled, replay wants ~1.0 cores at every ledger position and is 80-95%
  # of a job, so demand barely varies -- what varies is how much throttling a
  # range can absorb before it stops fitting inside the longest job's shadow.
  # 3267 of 3859 profiled ranges still fit at 0.5 cores. Empty disables tiering
  # and every range keeps the configured cpu request.
  # Paired with profileCpuSlowdown: the measured runtime multiplier per tier.
  profileCpuTiers: ""
  profileMargin: 1.15
  # CPU limit for ranges the profile has measured. Above the configured
  # worker limit on purpose: at a 2-core limit every range pegs 2.0, so the
  # peak is a ceiling and the profile never learns real demand. Unprofiled
  # ranges keep worker.resources.limits.cpu unchanged.
  # Empty = measured ranges run with no cpu limit, which is fastest on an
  # otherwise-free node (168s/111s/99s at limit 2/4/none). Set a value to cap.
  profileCpuLimit: ""
  # No margin on cpu: it is compressible, so under-requesting costs contention
  # Ceiling for profile-derived memory. Above the configured worker limit on
  # purpose: a range needing more than that must be able to ask for it
  # rather than be pinned under its own measured peak.
  profileMaxMemory: "32Gi"
  # Fixed allowance added to a range's measured rss, on top of profileMargin.
  # Not zero: memory.max bounds anon PLUS page cache, and a multiplicative
  # margin is meaningless at small rss. Measured with headroom 0, ranges
  # profiled at 190MiB rss got a 209MiB limit and 90 of them OOMKilled within
  # 90s of dispatch.
  profileCacheHeadroom: "512Mi"
  # Runtime-weighted allowance, scaled by seconds/longest so a 6h range gets
  # the full amount and a 13min one gets almost none. A flat margin misprices
  # both ends: the short ranges are measured tightly and need nothing, while
  # the long ones sit exposed to archive growth and cache drift for hours.
  profileRuntimeMemoryInsurance: "3Gi"
  # Probing 1000+ workers serially takes longer than the poll interval, so the
  # sampler runs threaded and bounded rather than inline.
  livenessProbeIntervalSeconds: 30
  livenessProbeTimeoutSeconds: 5
  livenessFailureThreshold: 3
  livenessMaxConcurrency: 32
  imagePullPolicy: IfNotPresent
  mission: "HistoryPubnetParallelCatchup"
  # Adds a `mission` label to worker pods, which kube-state-metrics exposes as
  # label_mission for the Grafana container panels. Default OFF: those panels
  # are per-pod, so 1024 workers would swamp any view with mission=$__all and
  # slow the shared dashboard for everyone. Turn on per-run for a small run, or
  # once the panels aggregate.
  emitMissionLabel: false
  loggingIntervalSeconds: 10
  maxAttempts: 5
  # Evictions, admission rejections and monitor restarts are not the range's
  # fault, so they do not share the failure budget above. Measured on ssc-test:
  # ten evictions across 25 workers put four healthy ranges on attempt 3 of 5.
  maxDisruptionAttempts: 20
  memBumpFactor: 1.5
  # An ephemeral-storage eviction repeats until the range gets more disk, so
  # it gets its own small budget rather than the environmental one.
  maxEphemeralAttempts: 4
  ephBumpFactor: 1.5
  maxEphemeral: "200Gi"
  maxMem: "48Gi"
  graceSeconds: 100
  # Must exceed any plausible monitor outage: completion is recorded to the
  # progress ConfigMap by the monitor, and a Job reclaimed before that happens
  # reads as "never ran" and gets redone.
  # 0 = no deadline. Catches a range wedged in archive retries: stellar-core
  # retries a missing/unreachable archive indefinitely rather than failing.
  #
  # 12h, not the 3h this used to be. "A prod range runs ~50 min" was the median
  # talking -- runtimes span 190x, p25 771s to a measured max of 5.9h, so 3h
  # killed 941 legitimate ranges and had to be hand-patched to 12h mid-run on
  # 2026-07-30. A timeout is terminal, so each of those would fail the mission.
  # Flat for every range; see ATTEMPT_DEADLINE_SECONDS in job_monitor.py for why
  # scaling it per-range by the profile was tried and removed.
  attemptDeadlineSeconds: 43200
  jobTtlSeconds: 600
  # Worker logs are pulled to the monitor's volume while each pod is still
  # alive, then collected in one exec at teardown instead of ~1024.
  logStorageClass: ""
  logStorageSize: "100Gi"
  saveSuccessLogs: true
  collectorPollSeconds: 5
  # Log collection polls rather than holding a follow=true stream per pod, so
  # concurrency is independent of worker.replicas. At 4096 pods and a 10s
  # interval this is ~90 in-flight polls.
  logPollSeconds: 10
  maxConcurrentPolls: 96
  maxPollChars: 8388608
  # Failed polls tolerated after a pod goes terminal before the collector stops
  # asking. Its log is not coming back and the task holds a poll slot.
  terminalPollAttempts: 3
  # Growth factor before an in-flight peak is flushed to its .metrics file, so a
  # collector restart cannot silently reset a range's high-water to zero.
  peakFlushRatio: 1.05
  # Poll cycles a stream gets to finalize after its pod leaves the pod list,
  # before it is cancelled and its connection slot reclaimed.
  collectorVanishedGraceCycles: 3
  collectorResources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "2Gi" }
  tolerateNodeTaints: []
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "2Gi" }

service_account:
  annotations: []
