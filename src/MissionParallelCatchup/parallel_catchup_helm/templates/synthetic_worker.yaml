{{- if .Values.integration.syntheticWorker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-synthetic-worker
data:
  worker.py: |
    import json
    import os
    import sys
    import time


    def required_int(name):
        value = int(os.environ[name])
        if value < 0:
            raise ValueError(f"{name} must be non-negative")
        return value


    def emit(message):
        print(message, flush=True)


    def write_json(path, value):
        tmp = path + ".tmp"
        with open(tmp, "w") as stream:
            json.dump(value, stream, sort_keys=True)
        os.replace(tmp, path)


    def hold_memory(mib):
        memory = bytearray(mib * 1024 * 1024)
        for offset in range(0, len(memory), 4096):
            memory[offset] = 1
        return memory


    def emit_tx_apply(milliseconds):
        emit("metric 'ledger.transaction.apply'")
        emit(f"sum = {milliseconds}ms")


    attempt = required_int("SYNTHETIC_ATTEMPT")
    target = required_int("SYNTHETIC_TARGET")
    count = required_int("SYNTHETIC_COUNT")
    key = os.environ["SYNTHETIC_KEY"]
    data_dir = os.environ.get("SYNTHETIC_DATA_DIR", "/data")
    state_path = os.path.join(data_dir, ".synthetic-replay.json")
    ready_path = os.path.join(data_dir, ".synthetic-successor-ready")
    release_path = os.path.join(data_dir, ".synthetic-release")

    if attempt == 1:
        anon_mib = required_int("SYNTHETIC_PREDECESSOR_ANON_MIB")
        working_set_mib = required_int("SYNTHETIC_PREDECESSOR_WORKING_SET_MIB")
        duration = float(os.environ["SYNTHETIC_PREDECESSOR_SECONDS"])
        tx_apply = required_int("SYNTHETIC_PREDECESSOR_TX_APPLY_MS")
        reached = max(target - 1, target - count)
        write_json(state_path, {"key": key, "reachedLedger": reached})
        memory = hold_memory(working_set_mib)
        emit(f"SYNTHETIC PEAK: anonBytes={anon_mib * 1024 * 1024} "
             f"workingSetBytes={working_set_mib * 1024 * 1024}")
        emit(f"SYNTHETIC PREDECESSOR: {key} persisted ledger {reached}")
        time.sleep(duration)
        emit_tx_apply(tx_apply)
        del memory
        sys.exit(3)

    with open(state_path) as stream:
        state = json.load(stream)
    if state.get("key") != key:
        raise RuntimeError("PVC state belongs to a different logical range")
    reached = int(state["reachedLedger"])
    emit(f"RESUME PROBE: offline-info reports lcl {reached}")
    emit(f"RESUME: {key} reached ledger {reached}, replay had started; skipping new-db")

    anon_mib = required_int("SYNTHETIC_SUCCESSOR_ANON_MIB")
    working_set_mib = required_int("SYNTHETIC_SUCCESSOR_WORKING_SET_MIB")
    minimum = float(os.environ["SYNTHETIC_SUCCESSOR_MINIMUM_SECONDS"])
    maximum = float(os.environ["SYNTHETIC_MAXIMUM_WAIT_SECONDS"])
    tx_apply = required_int("SYNTHETIC_SUCCESSOR_TX_APPLY_MS")
    memory = hold_memory(working_set_mib)
    emit(f"SYNTHETIC PEAK: anonBytes={anon_mib * 1024 * 1024} "
         f"workingSetBytes={working_set_mib * 1024 * 1024}")
    write_json(ready_path, {"attempt": attempt, "key": key, "reachedLedger": reached})

    started = time.monotonic()
    while time.monotonic() - started < maximum:
        elapsed = time.monotonic() - started
        if elapsed >= minimum and os.path.exists(release_path):
            emit_tx_apply(tx_apply)
            del memory
            sys.exit(0)
        time.sleep(0.25)
    raise RuntimeError("timed out waiting for the synthetic release marker")
{{- end }}
