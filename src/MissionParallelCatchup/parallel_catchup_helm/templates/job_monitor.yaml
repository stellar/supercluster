apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-job-monitor
  {{- with .Values.service_account.annotations }}
  annotations:
    {{- /* The mission sends an indexed array of {key,value}; a plain map is
           also accepted so the chart stays usable standalone. */}}
    {{- if kindIs "slice" . }}
    {{- range . }}
    {{ .key }}: {{ .value | quote }}
    {{- end }}
    {{- else }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
---
# Worker pods run under this, not the monitor's SA: IRSA trust for the S3
# history mirror is bound to this name/namespace. Same name the StatefulSet
# used, so existing role trust policies keep matching.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-supercluster-{{ .Release.Name }}
  {{- with .Values.service_account.annotations }}
  annotations:
    {{- /* The mission sends an indexed array of {key,value}; a plain map is
           also accepted so the chart stays usable standalone. */}}
    {{- if kindIs "slice" . }}
    {{- range . }}
    {{ .key }}: {{ .value | quote }}
    {{- end }}
    {{- else }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
---
# Namespaced and delete-free. The monitor creates Jobs and PVCs and reads their
# state; it never patches finalizers and has no access to PersistentVolumes, so
# it cannot orphan an EBS volume. Job/PVC cleanup happens through
# ownerReferences and ttlSecondsAfterFinished, not through this ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-job-monitor
rules:
  # Create-only. Jobs and PVCs are reclaimed via ownerReferences and
  # ttlSecondsAfterFinished, so this ServiceAccount never deletes or patches
  # anything and cannot orphan an EBS volume.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # delete is required by release_pvc: a completed range's volume is dead weight
  # and 4000 of them break the EBS CSI controller. Without it the monitor logs a
  # 403 warning per completion and silently leaks every volume until teardown.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  # create/patch is for the progress ConfigMap, which is the durable record of
  # completed ranges. Jobs are reclaimed during a long run, so their absence
  # must not be read as "never ran".
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-job-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-job-monitor
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-job-monitor
---
# Holds every worker's log for the run. The monitor is the only long-lived pod,
# which is what the driver used to rely on the StatefulSet workers for; with a
# Job per range there is nothing else that outlives the work.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-job-monitor-logs
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.monitor.logStorageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.monitor.logStorageSize }}
---
# The driver's only channel into the run: profile in via POST /start, status out
# of /status, logs pulled per file. Previously the driver read a ConfigMap and
# exec'd `tar` for the logs, which proxied every byte through the API server --
# ~0.3 MB per range, so ~1.2 GB of control-plane traffic on a 4000-range run.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-job-monitor
spec:
  selector:
    app: job-monitor
    release: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
{{- if .Values.monitor.routeHost }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-job-monitor
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.monitor.gatewayName }}
      namespace: {{ .Values.monitor.gatewayNamespace }}
  hostnames:
    - {{ .Values.monitor.routeHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-job-monitor
          port: 8080
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-job-monitor
spec:
  replicas: 1
  # Single writer is what removes the claim/requeue races the redis queue had.
  # Two replicas would reintroduce them; this must stay 1 without leader election.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-monitor
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: job-monitor
        release: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/prometheus"
    spec:
      serviceAccountName: {{ .Release.Name }}-job-monitor
      {{- with .Values.monitor.tolerateNodeTaints }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: job-monitor
          image: {{ .Values.monitor.image }}
          imagePullPolicy: {{ .Values.monitor.imagePullPolicy }}
          {{- if .Values.monitor.sourceConfigMap }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              {{- if .Values.monitor.sourceInstallDependencies }}
              pip install --no-cache-dir -q 'kubernetes~=36.0' 'aiohttp~=3.9'
              'prometheus-client~=0.19' &&
              {{- end }}
              exec python3 /app/job_monitor.py
          {{- end }}
          ports:
            - containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUN_NAME
              value: {{ .Release.Name | quote }}
            - name: CORE_IMAGE
              value: {{ .Values.worker.stellar_core_image | quote }}
            - name: WORKER_SERVICE_ACCOUNT
              value: stellar-supercluster-{{ .Release.Name }}
            - name: MISSION
              value: {{ .Values.monitor.mission | quote }}
            - name: EMIT_MISSION_LABEL
              value: {{ .Values.monitor.emitMissionLabel | quote }}
            - name: LOGGING_INTERVAL_SECONDS
              value: {{ .Values.monitor.loggingIntervalSeconds | quote }}
            - name: LIVENESS_PROBE_TIMEOUT_SECONDS
              value: {{ .Values.monitor.livenessProbeTimeoutSeconds | quote }}
            - name: LIVENESS_SWEEP_SECONDS
              value: {{ .Values.monitor.livenessSweepSeconds | quote }}
            - name: LIVENESS_MAX_CONCURRENCY
              value: {{ .Values.monitor.livenessMaxConcurrency | quote }}
            - name: RANGE_GENERATOR
              value: {{ .Values.range.generator | quote }}
            - name: STARTING_LEDGER
              value: {{ .Values.range.startingLedger | quote }}
            - name: LATEST_LEDGER_NUM
              value: {{ .Values.range.latestLedgerNum | quote }}
            - name: LEDGERS_PER_JOB
              value: {{ .Values.range.ledgersPerJob | quote }}
            - name: OVERLAP_LEDGERS
              value: {{ .Values.range.overlapLedgers | quote }}
            - name: RANGE_ORDER
              value: {{ .Values.range.order | quote }}
            - name: LOGARITHMIC_FLOOR_LEDGERS
              value: {{ .Values.range.logarithmicFloorLedgers | quote }}
            - name: PARALLELISM
              value: {{ .Values.worker.replicas | quote }}
            - name: STORAGE_MODE
              value: {{ .Values.worker.storageMode | quote }}
            - name: STORAGE_CLASS
              value: {{ .Values.worker.storageClass | quote }}
            - name: STORAGE_SIZE
              value: {{ .Values.worker.storageSize | quote }}
            - name: MAX_VOLUMES_PER_NODE
              value: {{ .Values.worker.maxVolumesPerNode | quote }}
            - name: ASAN_OPTIONS
              value: {{ .Values.worker.asanOptions | quote }}
            - name: REQ_CPU
              value: {{ .Values.worker.resources.requests.cpu | quote }}
            - name: REQ_MEM
              value: {{ .Values.worker.resources.requests.memory | quote }}
            # Only set in ephemeral mode: in PVC mode a large ephemeral request
            # makes disk the binding dimension and halves workers-per-node.
            - name: REQ_EPHEMERAL
              value: {{ .Values.worker.resources.requests.ephemeral_storage | quote }}
            - name: LIM_EPHEMERAL
              value: {{ .Values.worker.resources.limits.ephemeral_storage | quote }}
            - name: MAX_DISRUPTION_ATTEMPTS
              value: {{ .Values.monitor.attemptBudgets.disrupted | quote }}
            - name: MAX_REJECTED_ATTEMPTS
              value: {{ .Values.monitor.attemptBudgets.rejected | quote }}
            - name: MAX_FETCH_FAULT_ATTEMPTS
              value: {{ .Values.monitor.attemptBudgets.fetchFault | quote }}
            - name: MAX_OOM_ATTEMPTS
              value: {{ .Values.monitor.attemptBudgets.oom | quote }}
            - name: MAX_EPHEMERAL_ATTEMPTS
              value: {{ .Values.monitor.attemptBudgets.ephemeral | quote }}
            - name: MEM_BUMP_FACTOR
              value: {{ .Values.monitor.memBumpFactor | quote }}
            - name: EPH_BUMP_FACTOR
              value: {{ .Values.monitor.ephBumpFactor | quote }}
            - name: EPH_ESCALATION_CAP
              value: {{ .Values.monitor.maxEphemeral | quote }}
            # Escalating past the largest schedulable node makes the retry
            # Pending forever, which looks like a hang rather than a failure.
            - name: MAX_MEM
              value: {{ .Values.monitor.maxMem | quote }}
            - name: GRACE_SECONDS
              value: {{ .Values.monitor.graceSeconds | quote }}
            # Delays SIGTERM so the collector has more room to be holding a
            # stream when stellar-core prints its final medida block.
            - name: PRESTOP_SLEEP_SECONDS
              value: {{ .Values.monitor.prestopSleepSeconds | quote }}
            # A range stuck retrying the history archive never exits on its
            # own; without this it holds a slot for the life of the run.
            - name: ATTEMPT_DEADLINE_SECONDS
              value: {{ .Values.monitor.attemptDeadlineSeconds | quote }}
            - name: JOB_TTL_SECONDS
              value: {{ .Values.monitor.jobTtlSeconds | quote }}
            - name: LOG_DIR
              value: /logs
            - name: POOL_PREFIX
              value: {{ .Values.monitor.poolPrefix | quote }}
            - name: POOL_TIERS
              value: {{ .Values.monitor.poolTiers | quote }}
            - name: POOL_BLOCK_RUNGS
              value: {{ .Values.monitor.poolBlockRungs | quote }}
            - name: POOL_CROSS_RUNGS
              value: {{ .Values.monitor.poolCrossRungs | quote }}
            - name: POOL_VCPU
              value: {{ .Values.monitor.poolVcpu | quote }}
            - name: POOL_CPU
              value: {{ .Values.monitor.poolCpu | quote }}
            - name: POOL_UNPROFILED
              value: {{ .Values.monitor.poolUnprofiled | quote }}
            - name: POOL_NO_PROFILE
              value: {{ .Values.monitor.poolNoProfile | quote }}
            - name: POOL_MEM
              value: {{ .Values.monitor.poolMem | quote }}
            # Pods AND this with the tier label. Both capacity variants of a
            # tier share one label value, and a pod cannot otherwise express a
            # NodePool property; Karpenter labels every node with it itself.
            - name: CAPACITY_TYPE
              value: {{ .Values.monitor.capacityType | quote }}
            {{- if .Values.monitor.profileConfigMap }}
            - name: PROFILE_PATH
              value: /profile/profile.json
            - name: PROFILE_MARGIN
              value: {{ .Values.monitor.profileMargin | quote }}
            - name: PROFILE_MAX_MEM
              value: {{ .Values.monitor.profileMaxMemory | quote }}
            - name: PROFILE_CACHE_HEADROOM
              value: {{ .Values.monitor.profileCacheHeadroom | quote }}
            # Handed out in proportion to a range's own runtime, so the ranges
            # that sit exposed to drift the longest get the largest share.
            # Disk gets the same flat + runtime-weighted allowances as memory.
            - name: PROFILE_EPHEMERAL_HEADROOM
              value: {{ .Values.monitor.profileEphemeralHeadroom | quote }}
            - name: PROFILE_RUNTIME_EPHEMERAL_INSURANCE
              value: {{ .Values.monitor.profileRuntimeEphemeralInsurance | quote }}
            - name: PROFILE_MAX_EPHEMERAL
              value: {{ .Values.monitor.profileMaxEphemeral | quote }}
            - name: PROFILE_RUNTIME_MEMORY_INSURANCE
              value: {{ .Values.monitor.profileRuntimeMemoryInsurance | quote }}
            {{- end }}
            # Failed ranges are always saved; successful ones are the bulk of
            # the volume and can be turned off for a cheap run.
            - name: SAVE_SUCCESS_LOGS
              value: {{ .Values.monitor.saveSuccessLogs | quote }}
            {{- /*
                 Two accepted shapes: the mission emits structured selectors
                 ({key, operator, values}) like every other supercluster
                 mission, while a hand-run helm install more naturally passes
                 "key:value" strings. Only the first entry is used -- the
                 monitor takes a single label pair.
            */}}
            {{- with (first .Values.worker.requireNodeLabels) }}
            {{- if kindIs "map" . }}
            - name: NODE_LABEL_KEY
              value: {{ .key | quote }}
            - name: NODE_LABEL_VALUE
              value: {{ (first (default (list "") .values)) | quote }}
            {{- else }}
            - name: NODE_LABEL_KEY
              value: {{ (splitList ":" .) | first | quote }}
            - name: NODE_LABEL_VALUE
              value: {{ (splitList ":" .) | last | quote }}
            {{- end }}
            {{- end }}
            {{- with (first .Values.worker.avoidNodeLabels) }}
            {{- if kindIs "map" . }}
            - name: AVOID_NODE_LABEL_KEY
              value: {{ .key | quote }}
            - name: AVOID_NODE_LABEL_VALUE
              value: {{ (first (default (list "") .values)) | quote }}
            {{- else }}
            - name: AVOID_NODE_LABEL_KEY
              value: {{ (splitList ":" .) | first | quote }}
            - name: AVOID_NODE_LABEL_VALUE
              value: {{ (splitList ":" .) | last | quote }}
            {{- end }}
            {{- end }}
            {{- with (first .Values.worker.tolerateNodeTaints) }}
            - name: TOLERATE_TAINT
              value: {{ if kindIs "map" . }}{{ .key | quote }}{{ else }}{{ (splitList ":" .) | first | quote }}{{ end }}
            {{- end }}
          resources:
            {{- toYaml .Values.monitor.resources | nindent 12 }}
          # job_monitor.py mirrors its log to /data so it survives the pod.
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            {{- if .Values.monitor.profileConfigMap }}
            - name: profile
              mountPath: /profile
              readOnly: true
            {{- end }}
            {{- if .Values.monitor.sourceConfigMap }}
            - name: monitor-src
              mountPath: /app
            {{- end }}
          # No readinessProbe: nothing consumes Ready. There is no Service, and
          # the prometheus kubernetes-pods job keeps targets on the scrape
          # annotation alone, with no pod-ready filter.
          #
          # A dead pod watch stops all failure classification, which degrades
          # silently: later failures record outcome=unknown and get retried
          # blindly. Restart the container rather than run half-blind.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
        # Streams each worker pod's log from the moment it starts, so nothing
        # is lost when Karpenter reaps the node ~1 min after the pod exits --
        # and a stuck range is readable while it is still stuck. Separate
        # container so its memory limit is its own: holding ~1024 open streams
        # must not be affected by, or affect, the reconcile loop.
        - name: log-collector
          image: {{ .Values.monitor.image }}
          imagePullPolicy: {{ .Values.monitor.imagePullPolicy }}
          {{- if .Values.monitor.sourceConfigMap }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              {{- if .Values.monitor.sourceInstallDependencies }}
              pip install --no-cache-dir -q 'kubernetes~=36.0' 'aiohttp~=3.9'
              'prometheus-client~=0.19' &&
              {{- end }}
              exec python3 /app/log_collector.py
          {{- else }}
          # Resolved on PATH, not /usr/bin/python3: Dockerfile.jobmonitor builds
          # on python:3.12-slim, which ships the interpreter at
          # /usr/local/bin/python3. An absolute path here pins the chart to one
          # base image and fails as StartError -- the monitor container comes up
          # (it inherits the image CMD) and only the sidecar crashloops.
          command: ["python3", "log_collector.py"]
          {{- end }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUN_NAME
              value: {{ .Release.Name | quote }}
            - name: LOG_DIR
              value: /logs
            - name: COLLECTOR_POLL_SECONDS
              value: {{ .Values.monitor.collectorPollSeconds | quote }}
            - name: TERMINAL_POLL_ATTEMPTS
              value: {{ .Values.monitor.terminalPollAttempts | quote }}
            - name: LOG_POLL_SECONDS
              value: {{ .Values.monitor.logPollSeconds | quote }}
            # Ceiling on how long a follow stream is held for a condemned pod,
            # so a withdrawn drain notice cannot pin one open for a whole range.
            - name: DOOMED_POLL_SECONDS
              value: {{ .Values.monitor.doomedPollSeconds | quote }}
            - name: WATCH_TIMEOUT_SECONDS
              value: {{ .Values.monitor.watchTimeoutSeconds | quote }}
            - name: WATCH_RETRY_SECONDS
              value: {{ .Values.monitor.watchRetrySeconds | quote }}
            - name: MAX_DOOMED_FOLLOWS
              value: {{ .Values.monitor.maxDoomedFollows | quote }}
            - name: DOOMED_FOLLOW_SECONDS
              value: {{ .Values.monitor.doomedFollowSeconds | quote }}
            - name: MAX_CONCURRENT_POLLS
              value: {{ .Values.monitor.maxConcurrentPolls | quote }}
            - name: MAX_POLL_CHARS
              value: {{ .Values.monitor.maxPollChars | int64 | quote }}
            - name: PEAK_FLUSH_RATIO
              value: {{ .Values.monitor.peakFlushRatio | quote }}
            - name: COLLECTOR_VANISHED_GRACE_CYCLES
              value: {{ .Values.monitor.collectorVanishedGraceCycles | quote }}
            # Failures are always kept; successes are the bulk of the volume.
            - name: SAVE_SUCCESS_LOGS
              value: {{ .Values.monitor.saveSuccessLogs | quote }}
            # The peak-ephemeral sampler runs only in ephemeral mode. Without
            # this the collector defaults to pvc and silently records nothing.
            - name: STORAGE_MODE
              value: {{ .Values.worker.storageMode | quote }}
          resources:
            {{- toYaml .Values.monitor.collectorResources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /logs
            {{- if .Values.monitor.sourceConfigMap }}
            - name: monitor-src
              mountPath: /app
            {{- end }}
      volumes:
        {{- if .Values.monitor.profileConfigMap }}
        - name: profile
          configMap:
            name: {{ .Values.monitor.profileConfigMap }}
        {{- end }}
        {{- if .Values.monitor.sourceConfigMap }}
        - name: monitor-src
          configMap:
            name: {{ .Values.monitor.sourceConfigMap }}
        {{- end }}
        - name: data
          emptyDir: {}
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-job-monitor-logs
